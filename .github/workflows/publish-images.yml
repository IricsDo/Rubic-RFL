name: Publish Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          echo "IMAGE_NAMESPACE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NAMESPACE }}/backend:latest

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/frontend:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NAMESPACE }}/frontend:latest

      - name: Write deployment image references
        run: |
          mkdir -p reports
          {
            echo "RUBIC_BACKEND_IMAGE=${IMAGE_NAMESPACE}/backend:${SHORT_SHA}"
            echo "RUBIC_FRONTEND_IMAGE=${IMAGE_NAMESPACE}/frontend:${SHORT_SHA}"
          } > reports/published-images.env

      - name: Upload deployment image references
        uses: actions/upload-artifact@v4
        with:
          name: published-images
          path: reports/published-images.env
