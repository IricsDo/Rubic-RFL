name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rubic_rfl_test
          POSTGRES_USER: rubic
          POSTGRES_PASSWORD: rubic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubic -d rubic_rfl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
          python -m pip install -e "./rl[dev]"

      - name: Run backend tests
        env:
          RUBIC_SESSION_STORE_DIR: ${{ runner.temp }}/rubic-rfl-sessions
        run: python -m pytest -p no:cacheprovider backend/tests

      - name: Run PostgreSQL integration tests
        env:
          RUBIC_TEST_DATABASE_URL: postgresql://rubic:rubic@localhost:5432/rubic_rfl_test
        run: >
          python -m pytest -p no:cacheprovider
          backend/tests/test_postgres_integration.py
          backend/tests/test_postgres_runtime_store.py

      - name: Run frontend static smoke tests
        run: python -m pytest -p no:cacheprovider frontend/tests

      - name: Run RL tests
        working-directory: rl
        run: python -m pytest -p no:cacheprovider tests

      - name: Run Python coverage report
        env:
          RUBIC_SESSION_STORE_DIR: ${{ runner.temp }}/rubic-rfl-coverage-sessions
        run: python tools/coverage_report.py --out-dir reports

      - name: Run API performance smoke benchmark
        run: >
          python tools/benchmark_api.py
          --iterations 5
          --warmups 1
          --out reports/performance-smoke.json
          --enforce-budgets

      - name: Run WebSocket performance smoke benchmark
        run: >
          python tools/benchmark_websocket.py
          --iterations 5
          --warmups 1
          --out reports/websocket-performance-smoke.json
          --enforce-budgets

      - name: Run backend load smoke test
        run: >
          python tools/load_test_backend.py
          --requests 24
          --concurrency 4
          --warmups 4
          --out reports/backend-load-smoke.json
          --enforce-budgets

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/performance-smoke.json
            reports/websocket-performance-smoke.json
            reports/backend-load-smoke.json
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Validate monitoring Compose profile
        run: docker compose --profile monitoring config

      - name: Validate host-port Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.host-ports.yml config

      - name: Validate production Compose configuration
        run: docker compose -f deploy/compose.production.yml --env-file deploy/production.env.example config

      - name: Validate Prometheus configuration
        run: >
          docker run --rm
          -v "${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v2.55.1
          promtool check config /etc/prometheus/prometheus.yml

      - name: Build backend image
        run: docker build -f backend/Dockerfile --target runtime -t rubic-rfl-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t rubic-rfl-frontend:ci .

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        env:
          RUBIC_FRONTEND_MIN_AVERAGE_FPS: "45"
          RUBIC_FRONTEND_MIN_P10_FPS: "30"
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/frontend-fps-smoke.json
          if-no-files-found: ignore
