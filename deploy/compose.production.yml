name: rubic-rfl-prod

services:
  frontend:
    image: ${RUBIC_FRONTEND_IMAGE:-rubic-rfl-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25

  backend:
    image: ${RUBIC_BACKEND_IMAGE:-rubic-rfl-backend:local}
    restart: unless-stopped
    env_file:
      - path: production.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rubic_rfl}:${POSTGRES_PASSWORD:-replace_me}@postgres:5432/${POSTGRES_DB:-rubic_rfl}"
      REDIS_URL: "redis://redis:6379/0"
      RUBIC_SESSION_STORAGE_BACKEND: "${RUBIC_SESSION_STORAGE_BACKEND:-postgres}"
      RUBIC_SESSION_STORE_DIR: "/data/sessions"
      RUBIC_RL_MODEL_PATH: "/models/${RUBIC_RL_MODEL_FILE:-mlp-baseline-depth-1-2-3.npz}"
      RUBIC_RL_MAX_STEPS: "${RUBIC_RL_MAX_STEPS:-30}"
      RUBIC_RL_SEARCH_WIDTH: "${RUBIC_RL_SEARCH_WIDTH:-5}"
      RUBIC_RL_SEARCH_TOP_K: "${RUBIC_RL_SEARCH_TOP_K:-5}"
      RUBIC_RL_SEARCH_TRACE_LIMIT: "${RUBIC_RL_SEARCH_TRACE_LIMIT:-200}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - replay_sessions:/data/sessions
      - ../checkpoints:/models:ro
    networks:
      - public
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: production.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rubic_rfl}
      POSTGRES_USER: ${POSTGRES_USER:-rubic_rfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/app/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25

networks:
  public:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  replay_sessions:
