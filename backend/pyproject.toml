[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubic-rfl-backend"
version = "0.1.0"
description = "Backend and cube engine for the Rubic RFL solver platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "kociemba>=1.2.1",
  "numpy>=2.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
