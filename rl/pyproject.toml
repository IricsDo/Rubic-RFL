[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubic-rfl-rl"
version = "0.1.0"
description = "Reinforcement-learning environment and research utilities for Rubic RFL."
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.3",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "coverage[toml]>=7.6",
]
torch = [
  "torch>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rubic_rl*"]
